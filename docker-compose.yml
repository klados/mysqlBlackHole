services:
  redis:
    image: redis:alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      target: app
    environment:
      PORT: "${PORT:-3306}"
      REDIS_ADDR: "${REDIS_ADDR:-redis:6379}"
    ports:
      - "3306:3306"
    labels:
      - "mbh.logging.enabled=true"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  seed:
    build:
      context: .
      target: seed
    # Stable name so `docker logs mysqlblackhole-seed` works every run.
    # Note: `docker compose run` ignores this unless passed --name (see README/deploy).
    container_name: mysqlblackhole-seed
    environment:
      REDIS_ADDR: "${REDIS_ADDR:-redis:6379}"
    labels:
      - "mbh.logging.enabled=true"
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["seed"]
    restart: "no"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.3
    # Local-dev only: no auth. Bound to localhost (like redis/kibana) so only
    # this machine — or an SSH tunnel — can reach it. Never expose publicly.
    ports:
      - "127.0.0.1:9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.3
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "127.0.0.1:5601:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:5601/api/status || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  vector:
    image: timberio/vector:0.45.0-alpine
    # docker.sock is privileged (read-only here for log collection). Restrict host access.
    volumes:
      - ./vector.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  report:
    build:
      context: .
      target: report
    # Image name must match ofelia.job-run.report.image below so the daily
    # job reuses this locally built image.
    image: mysqlblackhole-report
    # Manual-only: `docker compose up` must NOT run it, otherwise every deploy
    # sends an extra report webhook on top of the daily Ofelia job. Run it with
    # `docker compose run --rm report [--window 1h]`; Ofelia runs the image daily.
    profiles: ["report"]
    environment:
      # In-compose address; the localhost default in .env is for host runs.
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ES_INDEX: "${ES_INDEX:-mysqlblackhole}"
      DISCORD_REPORT_WEBHOOK: "${DISCORD_REPORT_WEBHOOK:-}"
    depends_on:
      elasticsearch:
        condition: service_healthy
    # One-shot: no restart, and (via the `report` profile above) not started by
    # `docker compose up`. Runs only manually via
    # `docker compose run --rm report [--window 1h]` or from the daily Ofelia
    # job. Deliberately NOT labelled for Vector — its own logs must not pollute
    # the next report.
    restart: "no"

  ofelia:
    # Only maintained tag (tracks v0.3.22); job-run API verified against docs.
    image: mcuadros/ofelia:latest
    command: daemon --docker
    # docker.sock is privileged (read-only here for scheduling). Restrict host access.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    labels:
      ofelia.job-run.report.schedule: "${REPORT_SCHEDULE:-0 8 * * *}"
      ofelia.job-run.report.image: "mysqlblackhole-report"
      ofelia.job-run.report.command: "--window=${REPORT_WINDOW:-24h}"
      # Must be the compose default network so the job resolves `elasticsearch`.
      # Falls back to this checkout's project/network name; override with
      # COMPOSE_PROJECT_NAME when using `docker compose -p <name>`.
      ofelia.job-run.report.network: "${COMPOSE_PROJECT_NAME:-mysqlblackhole}_default"
      ofelia.job-run.report.environment: '["ELASTICSEARCH_URL=http://elasticsearch:9200", "ES_INDEX=${ES_INDEX:-mysqlblackhole}", "DISCORD_REPORT_WEBHOOK=${DISCORD_REPORT_WEBHOOK:-}"]'
      # Local-only image: never try the registry, just use the local build.
      ofelia.job-run.report.pull: "false"
    restart: unless-stopped