services:
  redis:
    image: redis:alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      target: app
    environment:
      PORT: "${PORT:-3306}"
      REDIS_ADDR: "${REDIS_ADDR:-redis:6379}"
      TLS_ENABLED: "${TLS_ENABLED:-true}"
      TLS_SANS: "${TLS_SANS:-}"
      TLS_CERT_FILE: "${TLS_CERT_FILE:-}"
      TLS_KEY_FILE: "${TLS_KEY_FILE:-}"
    ports:
      - "3306:3306"
    labels:
      - "mbh.logging.enabled=true"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  seed:
    build:
      context: .
      target: seed
    # Stable name so `docker logs mysqlblackhole-seed` works every run.
    # Note: `docker compose run` ignores this unless passed --name (see README/deploy).
    container_name: mysqlblackhole-seed
    environment:
      REDIS_ADDR: "${REDIS_ADDR:-redis:6379}"
    labels:
      - "mbh.logging.enabled=true"
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["seed"]
    restart: "no"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.3
    # Local-dev only: no auth. Keep unexposed (no ports published) and use SSH tunnel.
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.3
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "127.0.0.1:5601:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:5601/api/status || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  vector:
    image: timberio/vector:0.45.0-alpine
    # docker.sock is privileged (read-only here for log collection). Restrict host access.
    volumes:
      - ./vector.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped