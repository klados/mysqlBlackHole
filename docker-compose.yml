services:
  redis:
    image: redis:alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      target: app
    environment:
      PORT: "3306"
      REDIS_ADDR: redis:6379
    ports:
      - "3306:3306"
    labels:
      - "mbh.logging.enabled=true"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  seed:
    build:
      context: .
      target: seed
    environment:
      REDIS_ADDR: redis:6379
    labels:
      - "mbh.logging.enabled=true"
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["seed"]
    restart: "no"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.3
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "127.0.0.1:5601:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:5601/api/status || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  vector:
    image: timberio/vector:0.45.0-alpine
    volumes:
      - ./vector.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped