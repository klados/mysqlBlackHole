name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege for the deploy job.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # NOTE: consider SHA-pinning third-party actions + Dependabot for updates.

      - name: Ensure target dir
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            mkdir -p /srv/mysqlBlackHole

      - name: Copy project to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "."
          target: /srv/mysqlBlackHole
          overwrite: true

      - name: Deploy stack
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /srv/mysqlBlackHole
            # Never deploy git history or local env files to the honeypot host.
            rm -rf .git .github .idea .agents .env || true
            export PORT="${{ vars.PORT }}"
            export REDIS_ADDR="${{ vars.REDIS_ADDR }}"
            export HONEYPOT_USERS="${{ secrets.HONEYPOT_USERS }}"
            docker compose up -d --build
            docker compose run --rm seed
