name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege for the deploy job.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # NOTE: consider SHA-pinning third-party actions + Dependabot for updates.

      - name: Ensure target dir
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            mkdir -p /srv/mysqlBlackHole

      - name: Copy project to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "."
          target: /srv/mysqlBlackHole
          overwrite: true

      - name: Deploy stack
        env:
          DEPLOY_PORT: ${{ vars.PORT }}
          DEPLOY_REDIS_ADDR: ${{ vars.REDIS_ADDR }}
          DEPLOY_HONEYPOT_USERS: ${{ secrets.HONEYPOT_USERS }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # Pass runner-side env to the remote script by value (no inline
          # interpolation), so passwords with $, `"`, backticks, etc. survive.
          envs: DEPLOY_PORT,DEPLOY_REDIS_ADDR,DEPLOY_HONEYPOT_USERS
          script: |
            set -eu
            cd /srv/mysqlBlackHole
            # Never deploy git history or local env files to the honeypot host.
            rm -rf .git .github .idea .agents .env || true
            export PORT="$DEPLOY_PORT"
            export REDIS_ADDR="$DEPLOY_REDIS_ADDR"
            export HONEYPOT_USERS="$DEPLOY_HONEYPOT_USERS"
            if [ -z "${HONEYPOT_USERS:-}" ]; then
              echo "::warning::HONEYPOT_USERS is empty — seeder will fall back to public decoy credentials" >&2
            fi
            docker compose up -d --build
            # `up --build` skips the `seed` profile, so build it explicitly.
            # Otherwise `run` below can reuse a stale image without HONEYPOT_USERS support.
            docker compose build seed
            docker rm -f mysqlblackhole-seed || true
            docker compose run --rm --build --name mysqlblackhole-seed seed
